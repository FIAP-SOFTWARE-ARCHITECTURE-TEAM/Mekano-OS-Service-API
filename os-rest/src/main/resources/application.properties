# Mekano OS Service — Application Configuration
# Configurações em YAMLs contextuais (via quarkus.config.locations):
#   datasource-config.yml  — datasource, Flyway, Hibernate (perfis %dev/%prod/%test)
#   api-config.yml         — REST path, CORS, Jackson, REST clients, mensageria
#   openapi-config.yml     — Swagger UI, OpenAPI info
#   logging-config.yml     — JSON logging, log levels
#   auth-config.yml        — validação JWT (chave pública)
#   cache-config.yml       — Caffeine (vindo de os-infrastructure)
quarkus.config.locations=datasource-config.yml,api-config.yml,openapi-config.yml,logging-config.yml,cache-config.yml,auth-config.yml

# Indexar módulos dependentes para descoberta de beans CDI
quarkus.index-dependency.os-app.group-id=mekano-os
quarkus.index-dependency.os-app.artifact-id=os-application
quarkus.index-dependency.os-infra.group-id=mekano-os
quarkus.index-dependency.os-infra.artifact-id=os-infrastructure

