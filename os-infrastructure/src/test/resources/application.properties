quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:mekano_os_infra;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa

quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.rest-client.mekano-api.url=http://localhost:18080
quarkus.sns.devservices.enabled=false
quarkus.sns.endpoint-override=http://localhost:4566
quarkus.sns.aws.region=us-east-1
quarkus.sns.aws.credentials.type=static
quarkus.sns.aws.credentials.static-provider.access-key-id=test
quarkus.sns.aws.credentials.static-provider.secret-access-key=test
quarkus.sqs.devservices.enabled=false
quarkus.sqs.endpoint-override=http://localhost:4566
quarkus.sqs.aws.region=us-east-1
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=test
quarkus.sqs.aws.credentials.static-provider.secret-access-key=test
quarkus.log.level=WARN
